name: Read-only installer ownership primitive
# Actual GENERIC_READ hold, metadata-only handles did not block file write/rename.
on:
  push:
    branches: [ui-overhaul]
    paths: ['.github/workflows/installer-ownership-query.yml']
permissions:
  contents: read
jobs:
  query-only:
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and inspect synthetic owned paths only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $pwd 'verification/installer_transaction_review'
          $owned=Join-Path $env:RUNNER_TEMP ('hony-ownership-query-'+$env:GITHUB_RUN_ID)
          if(Test-Path $owned){throw 'fresh root required'}
          New-Item -ItemType Directory $owned | Out-Null
          try {
            $pins=Get-Content "$root/SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($name in $pins.Keys){
              $psi=[Diagnostics.ProcessStartInfo]::new();$psi.FileName='git';$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true
              $psi.ArgumentList.Add('cat-file');$psi.ArgumentList.Add('blob');$psi.ArgumentList.Add('HEAD:verification/installer_transaction_review/'+$name)
              $p=[Diagnostics.Process]::Start($psi);$stream=[IO.File]::Open((Join-Path $root $name),[IO.FileMode]::Create,[IO.FileAccess]::Write)
              try{$p.StandardOutput.BaseStream.CopyTo($stream)}finally{$stream.Dispose()}
              $p.WaitForExit();if($p.ExitCode -ne 0){throw 'blob failed'}
              if((Get-FileHash (Join-Path $root $name) -Algorithm SHA256).Hash.ToLower() -ne $pins[$name]){throw 'pin failed'}
            }
            $vs=(& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
            Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            $exe=Join-Path $owned 'held-query.exe'
            & cl.exe /nologo /std:c11 /W4 /WX /guard:cf /GS "$root/held_identity.c" "/Fe:$exe" "/Fo:$owned/" /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'compile failed'}
            New-Item -ItemType Directory "$owned/nested" | Out-Null
            [IO.File]::WriteAllText("$owned/nested/owned.txt",'synthetic-only')
            & $exe ([IO.Path]::GetFullPath((Join-Path $owned "nested/owned.txt")))
            if($LASTEXITCODE -ne 0){throw 'ordinary exact held path refused'}
            foreach($path in @('relative.txt',"$owned/nested/../nested/owned.txt","$owned/nested/owned.txt:stream")){
              & $exe $path
              if($LASTEXITCODE -eq 0){throw 'ambiguous path accepted'}
            }
            New-Item -ItemType Junction -Path "$owned/junction" -Target "$owned/nested" | Out-Null
            & $exe ([IO.Path]::GetFullPath((Join-Path $owned "junction/owned.txt")))
            if($LASTEXITCODE -eq 0){throw 'junction accepted'}
            Remove-Item -LiteralPath "$owned/junction" -Force
            $tokens=$null;$parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'readonly_inventory.ps1'),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw 'inventory source parse failed'}
            $inventory=(& (Join-Path $root 'readonly_inventory.ps1'))|ConvertFrom-Json
            if(-not $inventory.read_only -or $inventory.machine_identity_collected -ne $false -or $inventory.os.caption -notlike '*Windows*'){throw 'inventory readback failed'}
            Write-Output 'READONLY_INVENTORY_PARSE_RUN_KNOWN_FIELDS_PASS_NO_IDENTIFIERS_LOGGED'
            $file=[IO.Path]::GetFullPath((Join-Path $owned 'nested/owned.txt'))
            $psi=[Diagnostics.ProcessStartInfo]::new();$psi.FileName=$exe;$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true
            $psi.ArgumentList.Add($file);$psi.ArgumentList.Add('--hold-fixture-10s')
            $holder=[Diagnostics.Process]::Start($psi)
            try {
              $ready=$holder.StandardOutput.ReadLine()
              if(-not ($ready|ConvertFrom-Json).held){throw 'held readiness absent'}
              $denied=0
              Write-Output ('HOLDER_READY exited='+$holder.HasExited)
              try {$h=[IO.File]::Open($file,[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::ReadWrite);$h.Dispose();Write-Output 'HOLD_WRITE_ALLOWED'}catch [IO.IOException]{$denied++;Write-Output 'HOLD_WRITE_DENIED'}
              try {[IO.File]::Move($file,$file+'.moved');Write-Output 'HOLD_FILE_RENAME_ALLOWED'}catch [IO.IOException]{$denied++;Write-Output 'HOLD_FILE_RENAME_DENIED'}
              try {[IO.Directory]::Move((Join-Path $owned 'nested'),(Join-Path $owned 'renamed'));Write-Output 'HOLD_DIRECTORY_RENAME_ALLOWED'}catch [IO.IOException]{$denied++;Write-Output 'HOLD_DIRECTORY_RENAME_DENIED'}
              Write-Output ('HOLDER_AFTER_OPERATIONS exited='+$holder.HasExited+' denied='+$denied)
              if($denied -ne 3){throw 'write/rename hold not enforced'}
              if(-not $holder.WaitForExit(15000) -or $holder.ExitCode -ne 0){throw 'held fixture exit failed'}
              Write-Output 'READONLY_HELD_ANCESTOR_WRITE_FILE_RENAME_DIRECTORY_RENAME_REFUSED'
            } finally {if(-not $holder.HasExited){$holder.Kill();$holder.WaitForExit()};$holder.Dispose()}
            $link=Join-Path $owned 'hardlink.txt'
            New-Item -ItemType HardLink -Path $link -Target $file | Out-Null
            & $exe $file
            if($LASTEXITCODE -eq 0){throw 'multiple hardlinks accepted'}
            Remove-Item -LiteralPath $link -Force
            Push-Location $root
            try {& py -3.11 -m unittest -v; if($LASTEXITCODE -ne 0){throw 'model tests failed'}}finally{Pop-Location}
            Write-Output 'READONLY_OWNERSHIP_QUERY_ONLY_NOT_ROLLBACK_ACCEPTANCE'
          } finally {
            if(Test-Path "$owned/junction"){Remove-Item -LiteralPath "$owned/junction" -Force}
            Remove-Item -LiteralPath $owned -Recurse -Force
            if(Test-Path $owned){throw 'owned test root cleanup failed'}
          }
