name: Read-only parser trace capability check
on:
  push:
    branches: [ui-overhaul]
    paths: ['.github/workflows/parser-trace-capability.yml']
permissions:
  contents: read
jobs:
  capability-only:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile query-only probe, no session recording or parser launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $owned=Join-Path $env:RUNNER_TEMP ('hony-query-probe-'+$env:GITHUB_RUN_ID)
          if(Test-Path $owned){throw 'fresh root required'}
          New-Item -ItemType Directory $owned | Out-Null
          try {
            $root=Join-Path $pwd 'verification/parser_trace_review'
            $pins=Get-Content "$root/SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($name in $pins.Keys){
              $target=Join-Path $root $name
              # Native source is hashed via blob bytes to avoid checkout CRLF ambiguity.
              $psi=[Diagnostics.ProcessStartInfo]::new();$psi.FileName='git';$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true
              $psi.ArgumentList.Add('cat-file');$psi.ArgumentList.Add('blob');$psi.ArgumentList.Add('HEAD:verification/parser_trace_review/'+$name)
              $proc=[Diagnostics.Process]::Start($psi);$stream=[IO.File]::Open($target,[IO.FileMode]::Create,[IO.FileAccess]::Write)
              try{$proc.StandardOutput.BaseStream.CopyTo($stream)}finally{$stream.Dispose()}
              $proc.WaitForExit();if($proc.ExitCode -ne 0){throw 'blob failed'}
              if((Get-FileHash $target -Algorithm SHA256).Hash.ToLower() -ne $pins[$name]){throw 'source pin mismatch'}
            }
            $vs=(& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
            if(-not $vs){throw 'preinstalled MSVC required'}
            Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            $probe=Join-Path $owned 'query-probe.exe'
            & cl.exe /nologo /std:c11 /W4 /WX /guard:cf /GS "$root/session_probe.c" "/Fe:$probe" "/Fo:$owned/" advapi32.lib /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'compile refused'}
            foreach($name in @('HOnYParserFile','HOnYParserProcess')){
              $raw=& $probe query $name
              if($LASTEXITCODE -ne 0){throw 'query failed'}
              $status=$raw|ConvertFrom-Json
              Write-Output ('QUERY_ONLY '+$name+' absent='+$status.absent)
            }
            Push-Location $root
            try {& py -3.11 -m unittest -v; if($LASTEXITCODE -ne 0){throw 'synthetic tests failed'}}finally{Pop-Location}
            Write-Output 'PROBE_COMPILE_QUERY_ONLY_NO_RECORDING_NO_STOP_NO_PARSER_LAUNCH'
          } finally {
            Remove-Item -LiteralPath $owned -Recurse -Force
            if(Test-Path $owned){throw 'owned probe cleanup failed'}
          }
      - name: Inspect installed trace commands only, no recording or child launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('wpr.exe','tracerpt.exe','logman.exe')) {
            $command=Get-Command $name -ErrorAction SilentlyContinue
            if($command){
              $file=Get-Item -LiteralPath $command.Source
              Write-Output ('INSTALLED_TRACE_COMMAND '+$name+' '+$file.FullName+' '+$file.VersionInfo.FileVersion)
            } else {Write-Output ('TRACE_COMMAND_ABSENT '+$name)}
          }
          $wpr=Get-Command wpr.exe -ErrorAction SilentlyContinue
          if($wpr){
            & $wpr.Source -help start
            Write-Output ('WPR_HELP_EXIT '+$LASTEXITCODE)
            & $wpr.Source -status
            Write-Output ('WPR_STATUS_EXIT '+$LASTEXITCODE)
            & $wpr.Source -profiles
            Write-Output ('WPR_PROFILES_EXIT '+$LASTEXITCODE)
          }
          & logman.exe create trace /?
          Write-Output ('LOGMAN_HELP_EXIT '+$LASTEXITCODE)
          & tracerpt.exe /?
          Write-Output ('TRACERPT_HELP_EXIT '+$LASTEXITCODE)
          foreach($name in @('Microsoft-Windows-Kernel-File','Microsoft-Windows-Kernel-Process')) {
            try {
              $provider=Get-WinEvent -ListProvider $name
              Write-Output ('TRACE_PROVIDER '+$provider.Name+' '+$provider.Id)
              $provider.Events | Where-Object {$_.Id -in @(1,2,3,4,10,11,12,14,15,16,20,24,30)} | ForEach-Object {
                [pscustomobject]@{id=$_.Id;version=$_.Version;task=$_.Task.Name;opcode=$_.Opcode.Name;template=$_.Template} | ConvertTo-Json -Compress -Depth 4
              }
              $provider.Keywords | Select-Object Name,Value | Format-Table
            } catch {Write-Output ('TRACE_PROVIDER_UNAVAILABLE '+$name+' '+$_.Exception.GetType().Name)}
          }
          Write-Output 'CAPABILITY_ONLY_NO_RECORDING_LAUNCH_SECURITY_MUTATION'
          exit 0
