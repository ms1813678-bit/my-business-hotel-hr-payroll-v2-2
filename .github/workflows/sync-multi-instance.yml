name: sync-multi-instance

# Multi-instance sync harness: one main process and two device processes,
# each with its own PostgreSQL database. Test data only. Manual, PR, or a push to
# the ui-overhaul branch that touches the harness or the sync modules (never main).
on:
  workflow_dispatch:
  push:
    branches:
      - ui-overhaul
    paths:
      - "tests/sync_harness/**"
      - "app/sync_*.py"
      - ".github/workflows/sync-multi-instance.yml"
  pull_request:
    paths:
      - "tests/sync_harness/**"
      - "app/sync_*.py"
      - ".github/workflows/sync-multi-instance.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" pgserver==0.1.4
      - name: Run harness
        run: python -m tests.sync_harness.run --keep --work-dir sync-harness-work --json-out sync-harness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-harness-linux
          path: |
            sync-harness-report.json
            sync-harness-work/**/*.log
            sync-harness-work/**/*.txt
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: py -3.11 -m pip install -e ".[dev]" pgserver==0.1.4
      - name: Run harness
        run: py -3.11 -m tests.sync_harness.run --keep --work-dir sync-harness-work --json-out sync-harness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-harness-windows
          path: |
            sync-harness-report.json
            sync-harness-work/**/*.log
            sync-harness-work/**/*.txt
          if-no-files-found: warn
