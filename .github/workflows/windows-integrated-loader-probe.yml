name: "Integrated synthetic Windows loader isolation probe (diagnostic, not acceptance)"
# Diagnostic only: same launcher/token/job/ACLs, child is a kernel32-only loader probe. IFEO loader snaps OFF.
on:
  push:
    branches: [ui-overhaul]
    paths: [.github/workflows/windows-integrated-loader-probe.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and qualify real parser candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $owned=Join-Path $env:RUNNER_TEMP ('hony-integrated-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path $owned){throw 'Fresh owned root required'}
          $root=Join-Path $pwd 'verification/windows_integrated_candidate'
          try {
            New-Item -ItemType Directory $owned | Write-Output
            $manifest=Get-Content "$root/SOURCE-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            $productPins=Get-Content "$root/PRODUCT-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($path in $productPins.Keys){$manifest[$path]=$productPins[$path]}
            foreach($path in $manifest.Keys){
              $psi=[Diagnostics.ProcessStartInfo]::new();$psi.FileName='git';$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true
              $psi.ArgumentList.Add('cat-file');$psi.ArgumentList.Add('blob');$psi.ArgumentList.Add('HEAD:'+$path)
              $proc=[Diagnostics.Process]::Start($psi);$stream=[IO.File]::Open((Join-Path $pwd $path),[IO.FileMode]::Create,[IO.FileAccess]::Write)
              try{$proc.StandardOutput.BaseStream.CopyTo($stream)}finally{$stream.Dispose()}
              $proc.WaitForExit();if($proc.ExitCode -ne 0){throw 'Committed blob read failed'}
              if((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $manifest[$path]){throw 'Committed source hash mismatch'}
            }
            Write-Output ('ActualOS='+[Environment]::OSVersion.VersionString)
            $vs=(& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
            if(-not $vs){throw 'Installed MSVC missing'}
            Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            $launcher=Join-Path $owned 'candidate.exe'
            & cl.exe /nologo /std:c11 /W4 /WX /guard:cf /GS /DUNICODE /D_UNICODE "$root/launcher.c" "/Fe:$launcher" userenv.lib advapi32.lib /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'Native candidate compile failed'}
            $probe=Join-Path $owned 'probe_load.exe'
            $probeCtl=Join-Path $owned 'probe_ctl.dll'
            & cl.exe /nologo /std:c11 /W4 /WX /MT /GS /guard:cf /LD "$root/probe_ctl.c" "/Fe:$probeCtl" /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'Loader probe control DLL compile failed'}
            & cl.exe /nologo /std:c11 /W4 /WX /MT /GS /DUNICODE /D_UNICODE "$root/probe_load.c" "/Fe:$probe" /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'Loader probe compile failed'}
            & py -3.11 "$root/acquire_locked.py" --lock "$root/ACQUISITION-LOCK.json" --destination "$owned/acquired"
            if($LASTEXITCODE -ne 0){throw 'Locked acquisition failed'}
            foreach($name in @('python.exe','python314.dll')){
              $sig=Get-AuthenticodeSignature -LiteralPath "$owned/acquired/runtime/$name"
              Write-Output ($name+' signatureStatus='+$sig.Status+' signer='+$sig.SignerCertificate.Subject)
              if($sig.Status -ne 'Valid'){throw 'Runtime signature verification failed'}
            }
            Copy-Item -LiteralPath $probe -Destination "$owned/acquired/runtime/probe_load.exe"
            Copy-Item -LiteralPath $probeCtl -Destination "$owned/acquired/runtime/probe_ctl.dll"
            $python=Join-Path $owned 'acquired/runtime/python.exe'
            & $python -I -B -c 'import sys;print(sys.version);sys.exit(0 if sys.version_info[:3]==(3,14,10) else 1)'
            if($LASTEXITCODE -ne 0){throw 'Pinned runtime startup/version failed'}
            $packages=@{openpyxl="$owned/acquired/packages/openpyxl";xlrd="$owned/acquired/packages/xlrd";et_xmlfile="$owned/acquired/packages/et_xmlfile"}|ConvertTo-Json
            [IO.File]::WriteAllText("$owned/packages.json",$packages)
            $pin=(& py -3.11 "$root/stage_runtime.py" --runtime "$owned/acquired/runtime" --product $pwd --packages-json "$owned/packages.json" --destination "$owned/staged").Trim()
            if($LASTEXITCODE -ne 0 -or $pin -notmatch '^[0-9a-f]{64}$'){throw 'Private runtime staging failed'}
            $owner=(Get-Content "$owned/staged/CANDIDATE-OWNER.json" -Raw|ConvertFrom-Json).owner
            if(-not (Test-Path "$owned/staged/runtime/python314.dll")){throw 'Locked version stem mismatch'}
            $tokens=$null;$parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'loader_flag.ps1'),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count -ne 0){throw 'Loader flag script parse failed before registry effects'}
            . (Join-Path $root 'loader_flag.ps1')
            Write-Output 'LOADER_PROBE_IFEO_SNAPS=OFF'
            & "$root/qualify_runtime.ps1" -Launcher $launcher -Stage "$owned/staged" -ManifestPin $pin -Request "$root/request-xls.json" -Owner $owner -ProductRoot $pwd -TrustedPython (py -3.11 -c 'import sys;print(sys.executable)') -Probe
            # Read-only header facts of the staged python314.dll (same bytes the probe loaded). Never fails the job.
            try {
              & dumpbin.exe /nologo /dependents "$owned/staged/runtime/python314.dll" | ForEach-Object { 'dumpbin_dependents '+$_.Trim() } | Where-Object { $_ -match '^dumpbin_dependents [A-Za-z0-9_.-]+\.(dll|DLL)$' }
              & dumpbin.exe /nologo /headers "$owned/staged/runtime/python314.dll" | Select-String -Pattern 'DLL characteristics|Guard|Control Flow|dynamic base|NX compatible|High Entropy|Terminal Server' | ForEach-Object { 'dumpbin_header '+($_.Line.Trim() -replace '[^A-Za-z0-9 _.()/-]','') }
            } catch { Write-Output 'dumpbin_unavailable' }
            Write-Output 'Loader isolation probe returned; security/network acceptance remains separate and NOT_ESTABLISHED.'
          } finally {
            if(Test-Path $owned){Remove-Item -LiteralPath $owned -Recurse -Force}
            if(Test-Path $owned){throw 'Owned integrated root cleanup failed'}
            Write-Output 'Owned integrated root absence verified.'
          }
