name: Windows launcher probe (synthetic, no real data)
on:
  push:
    branches: [ui-overhaul]
    paths:
      - '.github/workflows/windows-launcher-probe.yml'
      - 'verification/launcher_windows/**'
      - 'app/launcher.py'
      - 'scripts/windows/stop.ps1'
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies (disposable runner)
        shell: pwsh
        run: python -m pip install .
      - name: Throwaway local PostgreSQL (runner only, trust auth, 127.0.0.1)
        shell: pwsh
        run: |
          $bin = Get-ChildItem (Join-Path $env:ProgramFiles "PostgreSQL") -Directory | Where-Object { Test-Path (Join-Path $_.FullName "bin\initdb.exe") } | Sort-Object Name -Descending | Select-Object -First 1
          if(-not $bin){throw 'runner PostgreSQL not found'}
          $b = Join-Path $bin.FullName "bin"
          $dir = Join-Path $env:RUNNER_TEMP "probe-pg"
          & "$b\initdb.exe" -D $dir -U probe --encoding=UTF8 --locale=C --auth=trust
          if($LASTEXITCODE -ne 0){throw 'initdb failed'}
          & "$b\pg_ctl.exe" -D $dir -o "-p 55433 -c listen_addresses=127.0.0.1" -w -l (Join-Path $env:RUNNER_TEMP "probe-pg.log") start
          if($LASTEXITCODE -ne 0){throw 'pg_ctl start failed'}
          "PROBE_DATABASE_URL=postgresql+psycopg://probe@127.0.0.1:55433/postgres" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Launcher under pythonw, wrong folder, stop script
        shell: pwsh
        run: |
          if($env:OS -ne 'Windows_NT'){throw 'not a Windows runner'}
          python verification/launcher_windows/probe.py
          if($LASTEXITCODE -ne 0){throw 'launcher probe reported failures'}
