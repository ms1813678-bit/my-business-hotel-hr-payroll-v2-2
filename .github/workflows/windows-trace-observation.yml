name: Diagnostic ETW trace observation only
on:
  push:
    branches: [ui-overhaul]
    paths:
      - .github/workflows/windows-trace-observation.yml
      - verification/windows_trace_diagnostic/**
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile, trace and qualify real parser candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $owned=Join-Path $env:RUNNER_TEMP ('hony-trace-observe-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path $owned){throw 'Fresh owned root required'}
          $root=Join-Path $pwd 'verification/windows_integrated_candidate'
          # Retention lasts only for this disposable hosted VM, not persistent storage.
          $safeCleanup=$true
          $ownedIdentity=$null
          $traceStarted=$false
          $traceStopped=$false
          $markerOwner=$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
          $guard=Join-Path $pwd 'verification/windows_entry_marker'
          $trace=Join-Path $pwd 'verification/windows_trace_diagnostic'
          try {
            $manifest=Get-Content "$root/SOURCE-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            $productPins=Get-Content "$root/PRODUCT-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($path in $productPins.Keys){$manifest[$path]=$productPins[$path]}
            $diag=Join-Path $pwd 'verification/windows_nodebug_diagnostic'
            $diagPins=Get-Content "$diag/OBSERVATION-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($path in $diagPins.Keys){$manifest[$path]=$diagPins[$path]}
            $guardPins=Get-Content "$guard/OBSERVATION-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($path in $guardPins.Keys){$manifest[$path]=$guardPins[$path]}
            $tracePins=Get-Content "$trace/TRACE-SHA256.json" -Raw|ConvertFrom-Json -AsHashtable
            foreach($path in $tracePins.Keys){$manifest[$path]=$tracePins[$path]}
            foreach($path in $manifest.Keys){
              $psi=[Diagnostics.ProcessStartInfo]::new();$psi.FileName='git';$psi.UseShellExecute=$false;$psi.RedirectStandardOutput=$true
              $psi.ArgumentList.Add('cat-file');$psi.ArgumentList.Add('blob');$psi.ArgumentList.Add('HEAD:'+$path)
              $proc=[Diagnostics.Process]::Start($psi);$stream=[IO.File]::Open((Join-Path $pwd $path),[IO.FileMode]::Create,[IO.FileAccess]::Write)
              try{$proc.StandardOutput.BaseStream.CopyTo($stream)}finally{$stream.Dispose()}
              $proc.WaitForExit();if($proc.ExitCode -ne 0){throw 'Committed blob read failed'}
              if((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $manifest[$path]){throw 'Committed source hash mismatch'}
            }
            $ownedIdentity=(& py -3.11 -B "$guard/owner_guard.py" create --root $owned --owner $markerOwner).Trim()
            if($LASTEXITCODE -ne 0 -or $ownedIdentity -notmatch '^[0-9]+:[0-9]+$'){throw 'Owned root identity unavailable; retain'}
            Write-Output ('ActualOS='+[Environment]::OSVersion.VersionString)
            $vs=(& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
            if(-not $vs){throw 'Installed MSVC missing'}
            Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            $launcher=Join-Path $owned 'candidate.exe'
            & cl.exe /nologo /std:c11 /W4 /WX /guard:cf /GS /DUNICODE /D_UNICODE "/I$root" "$diag/launcher_nodebug_diag.c" "/Fe:$launcher" userenv.lib advapi32.lib /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'Native candidate compile failed'}
            $watchdog=Join-Path $owned 'outer-watchdog.exe'
            & cl.exe /nologo /std:c11 /W4 /WX /guard:cf /GS /DUNICODE /D_UNICODE "$diag/outer_watchdog.c" "/Fo$owned/outer-watchdog.obj" "/Fe:$watchdog" /link /DYNAMICBASE /NXCOMPAT
            if($LASTEXITCODE -ne 0){throw 'Watchdog compile failed'}
            & py -3.11 "$root/acquire_locked.py" --lock "$root/ACQUISITION-LOCK.json" --destination "$owned/acquired"
            if($LASTEXITCODE -ne 0){throw 'Locked acquisition failed'}
            foreach($name in @('python.exe','python314.dll')){
              $sig=Get-AuthenticodeSignature -LiteralPath "$owned/acquired/runtime/$name"
              Write-Output ($name+' signatureStatus='+$sig.Status+' signer='+$sig.SignerCertificate.Subject)
              if($sig.Status -ne 'Valid'){throw 'Runtime signature verification failed'}
            }
            $python=Join-Path $owned 'acquired/runtime/python.exe'
            & $python -I -B -c 'import sys;print(sys.version);sys.exit(0 if sys.version_info[:3]==(3,14,10) else 1)'
            if($LASTEXITCODE -ne 0){throw 'Pinned runtime startup/version failed'}
            $packages=@{openpyxl="$owned/acquired/packages/openpyxl";xlrd="$owned/acquired/packages/xlrd";et_xmlfile="$owned/acquired/packages/et_xmlfile"}|ConvertTo-Json
            [IO.File]::WriteAllText("$owned/packages.json",$packages)
            $pin=(& py -3.11 "$root/stage_runtime.py" --runtime "$owned/acquired/runtime" --product $pwd --packages-json "$owned/packages.json" --destination "$owned/staged").Trim()
            if($LASTEXITCODE -ne 0 -or $pin -notmatch '^[0-9a-f]{64}$'){throw 'Private runtime staging failed'}
            $owner=(Get-Content "$owned/staged/CANDIDATE-OWNER.json" -Raw|ConvertFrom-Json).owner
            if(-not (Test-Path "$owned/staged/runtime/python314.dll")){throw 'Locked version stem mismatch'}
            $launcherPin=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLower()
            $watchdogPin=(Get-FileHash -LiteralPath $watchdog -Algorithm SHA256).Hash.ToLower()
            Write-Output ('diagnostic_launcher_sha256='+$launcherPin+' watchdog_sha256='+$watchdogPin)
            $tokens=$null;$parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $diag 'qualify_diagnostic.ps1'),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count -ne 0){throw 'Diagnostic profile script parse refused before profile creation'}
            # Trace preconditions and session start happen BEFORE the retention flag and the launch: a refusal here launches nothing.
            . "$trace/trace_control.ps1"
            Assert-TraceAllowed
            $etl=Join-Path $owned 'kernel.etl'
            Start-KernelTrace -File $etl
            $traceStarted=$true
            # Fresh child PowerShell makes exit125 observable without exiting this owner.
            # Retain the entire owned root if launch/exit is unknown. Never infer from stderr.
            $safeCleanup=$false
            & pwsh -NoProfile -File "$diag/qualify_diagnostic.ps1" -Launcher $launcher -Stage "$owned/staged" -ManifestPin $pin -Owner $owner -ProductRoot $pwd -TrustedPython (py -3.11 -c 'import sys;print(sys.executable)') -Watchdog $watchdog -WatchdogPin $watchdogPin -LauncherPin $launcherPin
            $diagnosticExit=$LASTEXITCODE
            Write-Output ('diag_nodebug_child_exit code='+$(if($null -eq $diagnosticExit){'missing'}else{[string]$diagnosticExit})+' not_acceptance=1')
            # The stop can never mask the exit line above: failure is recorded, not thrown; the finally block stops again.
            try{Stop-KernelTrace;$traceStopped=$true}catch{Write-Output 'trace_stop_failed=1 inconclusive=1'}
            if($diagnosticExit -in @(0,122,123,124,126)){$safeCleanup=$true}
            else{throw 'Diagnostic safety failure or unknown exit; owned stage retained'}
            # Read-only analysis of the stopped trace. A failure here never changes the exit handling below.
            try{
              $etlBytes=(Get-Item -LiteralPath $etl).Length
              $dump=Join-Path $owned 'kernel.xml'
              $rpt=Start-Process -FilePath tracerpt.exe -ArgumentList @($etl,'-of','XML','-o',$dump,'-y','-lr','-summary',(Join-Path $owned 'summary.txt')) -PassThru -NoNewWindow
              if(-not $rpt.WaitForExit(150000)){$rpt.Kill();Write-Output 'trace_analysis_failed tracerpt_timeout=1 inconclusive=1'}
              elseif(-not (Test-Path -LiteralPath $dump)){Write-Output 'trace_analysis_failed dump_absent=1 inconclusive=1'}
              else{if(Test-Path -LiteralPath (Join-Path $owned 'summary.txt')){Get-Content -LiteralPath (Join-Path $owned 'summary.txt') | Where-Object {$_ -match '^(\||Total)'} | Select-Object -First 120 | ForEach-Object {if($_.Length -gt 160){$_.Substring(0,160)}else{$_}}}
                & py -3.11 -B "$trace/analyze_trace.py" --dump $dump --token (Split-Path -Leaf $owned) --etl-bytes $etlBytes}
            }catch{Write-Output 'trace_analysis_failed exception=1 inconclusive=1'}
            Write-Output ('diag_nodebug_workflow exit='+$diagnosticExit+' not_acceptance=1 debugger_only_cause=NOT_ESTABLISHED')
            if($diagnosticExit -ne 0){throw 'Diagnostic observation did not return matching decoded output'}
          } finally {
            if($traceStarted -and -not $traceStopped){try{Stop-KernelTrace}catch{Write-Output 'trace_stop_failed=1 inconclusive=1'}}
            if(-not $safeCleanup){throw 'Stage retention required; cleanup not confirmed'}
            if(Test-Path $owned){
              if(-not $ownedIdentity){throw 'Owned identity unknown; retain'}
              & py -3.11 -B "$guard/owner_guard.py" cleanup --root $owned --owner $markerOwner --identity $ownedIdentity
              if($LASTEXITCODE -ne 0){throw 'Owned identity/cleanup refusal; retained'}
            }
            if(Test-Path $owned){throw 'Owned integrated root cleanup failed'}
            Write-Output 'Owned integrated root absence verified.'
          }
