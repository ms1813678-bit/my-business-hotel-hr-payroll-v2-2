<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — نظام الموارد البشرية</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-shell">
    <form class="login-card" method="post" action="/login">
      <nav class="language-switch login-language" aria-label="Language"><a href="/language/ar">العربية</a><a href="/language/en">English</a><a href="/language/zh">中文</a></nav>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="login-brand">
        <img class="brand-logo" src="/static/logo.png" alt="M.Y. BUSINESS HOTEL">
        <p class="eyebrow" style="margin-bottom:0">M.Y. BUSINESS HOTEL</p>
        <p class="brand-zh">米亚酒店</p>
      </div>
      <h1 style="text-align:center">تسجيل الدخول</h1>
      {% if error %}<p class="error">{{ error }}{% if lockout_minutes %} <span class="lockout-minutes">{{ lockout_minutes }}</span> <span class="lockout-unit">{{ lockout_unit }}</span>{% endif %}</p>{% endif %}
      <label>اسم المستخدم
        <input name="username" autocomplete="username" required maxlength="80" placeholder="أدخل اسم المستخدم" dir="rtl">
      </label>
      <label>كلمة المرور
        <input name="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور" dir="rtl">
      </label>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="muted small" style="margin-top:16px; text-align:center"><span class="dev-credit"><img class="dev-credit-logo" src="/static/hony-logo.svg" alt="HOnY">Developed by Abu Younes · 2026</span></p>
    </form>
  </main>
</body>
</html>
