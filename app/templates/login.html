<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — نظام الموارد البشرية</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-shell">
    <form class="login-card" method="post" action="/login">
      <nav class="language-switch login-language" aria-label="Language"><a href="/language/ar">العربية</a><a href="/language/en">English</a><a href="/language/zh">中文</a></nav>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <p class="eyebrow">فندق M.Y. Business</p>
      <h1>تسجيل دخول الإدارة</h1>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label>اسم المستخدم
        <input name="username" autocomplete="username" required maxlength="80" placeholder="أدخل اسم المستخدم" dir="rtl">
      </label>
      <label>كلمة المرور
        <input name="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور" dir="rtl">
      </label>
      <button type="submit" class="btn-primary">دخول إلى النظام</button>
      <p class="muted small" style="margin-top:14px">Developed by Abu Younes</p>
    </form>
  </main>
</body>
</html>
